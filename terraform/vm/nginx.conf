server {
          # It is important to keep the correct indentation in this file
          listen 80;
          listen [::]:80;
          server_name ~^(?!www\.)[^.]+\.([^./]+)$;
          return 301 http://www.$host$request_uri;
          # redirect any naked domain to www.
      }
      server {
          server_name www.oreplay.es;
          root /var/www/html;
          index index.html index.htm index.nginx-debian.html;
          client_max_body_size 30M;
          # nchan holds these connections open with no traffic in between, so the hop
          # must not buffer, must not time out at the default 60s, and must forward
          # the websocket handshake instead of swallowing Upgrade as hop-by-hop.
          location /api/v1/live/ {
              proxy_pass http://localhost:30001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
          location /api/ {
              proxy_pass http://localhost:30001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          location /front/ {
              proxy_pass http://localhost:30001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          location / {
              proxy_pass http://localhost:30001;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          listen 80;
          listen [::]:80;
      }
      server {
          server_name preprod.oreplay.es;
          root /var/www/html;
          index index.html index.htm index.nginx-debian.html;
          client_max_body_size 30M;
          # nchan holds these connections open with no traffic in between, so the hop
          # must not buffer, must not time out at the default 60s, and must forward
          # the websocket handshake instead of swallowing Upgrade as hop-by-hop.
          location /api/v1/live/ {
              proxy_pass http://localhost:30003;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_buffering off;
              proxy_cache off;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
          location /api/ {
              proxy_pass http://localhost:30003;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          location / {
              proxy_pass http://localhost:30004;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
          listen 80;
          listen [::]:80;
      }
